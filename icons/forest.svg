<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a3a2a"/>
      <stop offset="100%" stop-color="#0d1f16"/>
    </radialGradient>
    <linearGradient id="tree" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="120" height="120" rx="28" fill="url(#bg)"/>
  <!-- Glow ring -->
  <circle cx="60" cy="60" r="50" fill="none" stroke="url(#ring)" stroke-width="2" opacity="0.6"/>
  <!-- Tree -->
  <polygon points="60,18 82,55 70,55 78,75 60,75 42,75 50,55 38,55" fill="url(#tree)"/>
  <!-- Trunk -->
  <rect x="55" y="75" width="10" height="14" rx="3" fill="#16a34a"/>
  <!-- Sound waves -->
  <path d="M 28 50 Q 20 60 28 70" stroke="#4ade80" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.7"/>
  <path d="M 22 44 Q 10 60 22 76" stroke="#4ade80" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.4"/>
  <path d="M 92 50 Q 100 60 92 70" stroke="#4ade80" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.7"/>
  <path d="M 98 44 Q 110 60 98 76" stroke="#4ade80" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.4"/>
</svg>
